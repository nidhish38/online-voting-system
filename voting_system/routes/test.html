<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information - Sutaria Travels</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 p-4 bg-white shadow rounded" style="max-width: 500px;">
    <h1 class="text-center text-primary">SUTARIA TRAVELS</h1>
    <hr>

    <form action="#">
        <div class="mb-3">
            <input type="text" name="pickup" class="form-control" placeholder="PICKUP POINT">
        </div>

        <div class="mb-3">
            <input type="text" name="drop" class="form-control" placeholder="DROP POINT">
        </div>

         <div class="mb-3">
            <input type="number" name="mobile" class="form-control" placeholder="NUMBER">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">CAR TYPE</label>
            <select name="Role" class="form-select">
                <option value="1">AC</option>
                <option value="2">NON AC</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">CAR AVAILABLE</label>
            <select name="role2" class="form-select">
                <option value="1">EECO</option>
                <option value="2">ERTIGA</option>
                <option value="3">MINI BUS</option>
                <option value="4">TOOFAN</option>
            </select>
        </div>

        <div class="alert alert-info text-center fw-bold">
            For payment inquiry contact - 9773179856
        </div>
        <button class="btn btn-primary">SUBMIT</button>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
